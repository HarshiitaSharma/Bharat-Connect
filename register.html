<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Citizen Connect</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page"> <div class="login-container">
        
        <form id="registerForm" class="card" action="php/register_process.php" method="POST">
            
            <h2 class="brand" style="text-align: center; margin-bottom: 1rem; color: #333;">
                Bharat Connect
            </h2>
            <p style="text-align: center;">Create your new citizen account.</p>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Optional">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <div class="form-actions" style="margin-top: 1rem;">
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </div>

            <p class="form-links">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </form>
    </div>

    </body>
</html>
